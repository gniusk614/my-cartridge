name: Publish playable web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify tested export matches source
        run: python3 tools/prepare_web.py --check
      - name: Check fullscreen and orientation behavior
        run: node --test tools/test_web_shell.mjs
      - name: Validate sample schemas
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 tools/check_content.py
      - name: Upload playable build
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
